name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job here only reads the repo. Artifact upload uses
# the runtime token, not GITHUB_TOKEN, so it needs nothing extra.
permissions:
  contents: read

jobs:
  # Derive the Playwright container tag from the lockfile so the image's
  # baked-in browsers can never drift from the installed @playwright/test.
  # Why this exists: the tag used to be hard-coded, and Dependabot can't see
  # the coupling — it bumped @playwright/test 1.62 -> 1.63 and left the tag,
  # so every spec failed with "Executable doesn't exist at
  # .../chromium_headless_shell-1243". That could not be caught on the PR
  # itself, because E2E is skipped on Dependabot runs (no secrets), so it
  # only surfaced after merge, on main. See PR #247.
  #
  # Read from package-lock.json, not package.json: the lockfile carries the
  # exact resolved version that `npm ci` installs, while package.json only
  # carries a caret range that may resolve higher.
  #
  # If MCR has no image for that version the test job fails to start. That is
  # deliberate — a loud failure beats silently running mismatched browsers.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "Playwright version from lockfile: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialise this job repo-wide. Every run logs in as the same
    # E2E_TEST_EMAIL against pogosundet-preview, and some specs mutate
    # per-user state that is globally unique — live_locations has user_id as
    # its PRIMARY KEY, so that account has exactly one share row for the whole
    # project. When two runs overlap, one starts a share and the other times
    # out clicking "Del min position", which LiveLocationScreen hides behind
    # {!isSharing && …}. That is what cancelled PR #256: the main run from
    # #255 and the #256 PR run overlapped, E2E ran 17m35s against this 20min
    # timeout, and 12 live-location specs failed.
    #
    # The group name is deliberately constant — no github.ref — so runs on
    # DIFFERENT branches queue behind each other, which is the whole point.
    # cancel-in-progress: false because a half-finished E2E leaves a share
    # row behind; let it finish and clean up.
    #
    # Known limitation: GitHub keeps only ONE pending run per group, so if a
    # third run arrives while one is running and one is pending, the pending
    # one is cancelled. `test` is a required check, so that shows up as a
    # cancelled check needing a re-run rather than a wrong result. Acceptable
    # at this repo's volume; if it starts biting, the real fix is a second
    # test account so runs stop sharing state.
    concurrency:
      group: ci-e2e-shared-test-account
      cancel-in-progress: false
    # 'true' on normal PRs/pushes; '' (falsey) on Dependabot-triggered runs,
    # which GitHub deliberately withholds repo secrets from. Steps that need a
    # real Supabase backend (E2E) are gated on this; the rest run either way
    # (Build uses placeholder fallbacks). Same pattern as claude-review.yml's
    # HAS_TOKEN. Lets Dependabot PRs pass lint+typecheck+build (which is what
    # actually validates a dependency bump) while skipping the backend-only E2E.
    env:
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
    # Run inside Playwright's official image: the browsers and all OS deps are
    # pre-installed, so CI no longer downloads Chromium from cdn.playwright.dev
    # at runtime. That CDN download intermittently stalls after reaching 100%
    # and hung the job for days (PRs #64–#68). The image is pulled from
    # Microsoft's container registry instead. The tag is derived from the
    # lockfile by the playwright-version job above, so it tracks
    # @playwright/test automatically instead of needing a manual bump.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The canonical type gate. CLAUDE.md calls `npm run build` the type gate,
      # but nothing in CI used to build or typecheck — so TS errors could merge.
      # `tsc --noEmit` is the fast standalone check.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      # Coverage over src/lib/** pure-logic modules (report #17). Visibility
      # tool only — continue-on-error so low numbers never block a merge.
      # Promote to a hard gate by removing continue-on-error and adding
      # thresholds to vitest.config.ts once a baseline is known.
      - name: Coverage (src/lib/**)
        run: npm run test:coverage
        continue-on-error: true

      # Full production build — catches build-time failures `tsc` misses (RSC
      # boundaries, route config, bundling). NEXT_PUBLIC_* are read at build
      # time for the client bundle; Sentry source-map upload stays skipped
      # without SENTRY_AUTH_TOKEN (see next.config.ts).
      # Placeholder fallbacks (||) so the build still runs when the real secrets
      # are absent (Dependabot runs). The build only needs the NEXT_PUBLIC_* vars
      # to be present and well-formed for the client bundle, not to reach a live
      # Supabase — so a dummy URL/key is enough to validate that a dependency
      # bump still compiles and builds.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      # E2E boots the app against a real Supabase, so it can't run without the
      # secrets (Dependabot runs). Skipped there; lint+typecheck+build still gate
      # the dependency. Normal PRs/pushes run it unchanged.
      - name: E2E tests (Playwright)
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # Only meaningful when E2E actually ran; skip otherwise so it doesn't try
      # to upload a non-existent report on a Dependabot run that failed earlier.
      - name: Upload Playwright report
        if: (failure() || cancelled()) && env.HAS_SUPABASE_SECRETS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
